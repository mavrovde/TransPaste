version: 2
updates:
  # Keep GitHub Actions (checkout, upload-artifact, CodeQL) on current majors
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Swift package dependencies (currently none, but covers future additions)
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
