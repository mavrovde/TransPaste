name: CodeQL

# Swift analysis takes ~30 min on a macOS runner and personal accounts have a
# small concurrent-runner pool, so scans are strictly rationed:
# - only when Swift code or build inputs actually change (paths filter)
# - superseded runs cancel automatically (concurrency group)
# - weekly full scan + manual workflow_dispatch as the safety net
# - workflow edits alone do NOT trigger a scan (use workflow_dispatch to validate)
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'build.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'build.sh'
  schedule:
    - cron: '30 5 * * 1'
  # On-demand scan (e.g. after workflow changes): gh workflow run codeql.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # Manual build: the Swift autobuilder's xcodebuild/SPM heuristics hang
          # on this Xcode-less swiftc project
          build-mode: manual

      - name: Build
        run: ./build.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
