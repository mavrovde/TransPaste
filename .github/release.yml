# Categories for auto-generated release notes (gh api .../generate-notes)
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 🔧 CI & Tooling
      labels:
        - ci
        - tooling
        - dependencies
    - title: Other Changes
      labels:
        - "*"
